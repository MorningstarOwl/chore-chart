# The add-on is the published chore-chart image plus a start script. Bump these tags together
# with `version` in config.yaml; CI publishes ghcr.io/morningstarowl/chore-chart:1.0.1
# when a v<version> tag is pushed.
build_from:
  aarch64: ghcr.io/morningstarowl/chore-chart:1.0.1
  amd64: ghcr.io/morningstarowl/chore-chart:1.0.1
